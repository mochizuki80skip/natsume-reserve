# Xserver 版：画面をビルドし、配布用 zip を作る。Secrets が登録されていれば SSH で Xserver にも反映する
name: Deploy to Xserver

on:
  push:
    branches: [main]
    paths: ['xserver/**', '.github/workflows/deploy-xserver.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.XSERVER_HOST != '' && secrets.XSERVER_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xserver/frontend/package-lock.json
      - name: Install and test frontend
        working-directory: xserver/frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
          npm run build
      - name: PHP syntax check
        run: |
          sudo apt-get install -y -qq php-cli > /dev/null
          find xserver/app xserver/public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Make zip
        # zip の中身＝サブドメインのフォルダにそのまま置く形（public の中身＋app フォルダ）。config.php は入れない
        run: |
          rm -rf site && mkdir -p site/natsume-reserve-xserver
          cp -a xserver/public/. site/natsume-reserve-xserver/
          cp -a xserver/app site/natsume-reserve-xserver/app
          rm -f site/natsume-reserve-xserver/app/config.php
          (cd site && zip -qr ../natsume-reserve-xserver.zip natsume-reserve-xserver)
      - uses: actions/upload-artifact@v4
        with:
          name: natsume-reserve-xserver
          path: natsume-reserve-xserver.zip
          retention-days: 30
      - name: Deploy over SSH (only when secrets are set)
        if: env.HAS_SSH == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          DIR: ${{ secrets.XSERVER_DIR }}   # 予約システムのフォルダ（例：/home/main80skip/hachimaru-80skip.com/public_html/yoyaku.hachimaru-80skip.com）
        run: |
          # 更新先は「…/public_html/予約システム専用フォルダ」の形だけ許可する（空欄や public_html そのものは中止）
          case "$DIR" in
            /home/*/public_html/?*) ;;
            *) echo "XSERVER_DIR が正しくありません（例：/home/main80skip/hachimaru-80skip.com/public_html/yoyaku.hachimaru-80skip.com）" >&2; exit 1;;
          esac
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keyscan -p 10022 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -p 10022 -i ~/.ssh/id_xserver -o StrictHostKeyChecking=yes"
          # 安全確認：WordPress のフォルダ（wp-config.php などがある所）には絶対に反映しない
          $SSH "$USER@$HOST" "set -e; case '$DIR' in */public_html|*/public_html/) echo 'XSERVER_DIR がドメイン直下の public_html です。予約システム専用のフォルダを指定してください' >&2; exit 1;; esac; \
            for f in wp-config.php wp-login.php wp-settings.php; do if [ -e '$DIR'/\$f ]; then echo \"WordPress のファイル（\$f）があるため中止しました\" >&2; exit 1; fi; done; \
            mkdir -p '$DIR/app'"
          # 予約システムのフォルダの中だけを更新する（config.php はサーバー側のものを残す）
          rsync -az --delete --exclude 'config.php' -e "$SSH" xserver/app/ "$USER@$HOST:$DIR/app/"
          # /media/ は管理画面からアップロードした SNS 投稿の画像なので消さない
          rsync -az --delete --exclude '/app/' --exclude '/media/' -e "$SSH" xserver/public/ "$USER@$HOST:$DIR/"
          echo "deployed to $HOST:$DIR"
